<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Orders | Flowers & Waffles</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #fff0f5; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #ff8fab; padding: 12px 25px; color: white; }
        .top-bar span { font-weight: bold; font-size: 1.1rem; }
        .top-bar div { display: flex; gap: 10px; }
        .top-bar button { margin: 0; padding: 7px 16px; font-size: 0.85rem; background: white; color: #ff4d6d; }
        .page-title { margin: 30px 0 10px; color: #ff4d6d; }
        .order-card {
            background: white;
            border-radius: 15px;
            padding: 22px 28px;
            margin: 15px auto;
            width: 55%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: left;
        }
        .order-card h3 { color: #ff4d6d; margin: 0 0 12px; font-size: 1rem; }
        .order-card ul { margin: 8px 0; padding-left: 20px; color: #555; }
        .order-card ul li { margin-bottom: 4px; }
        .order-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
        .order-total { font-weight: bold; color: #333; font-size: 1rem; }
        .status { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: bold; }
        .status-Pending { background: #fff3cd; color: #856404; }
        .status-Delivered { background: #d1e7dd; color: #0a3622; }
        .status-Processing { background: #cfe2ff; color: #084298; }
        .empty-msg { margin-top: 60px; color: #888; }
        .empty-msg a { color: #ff8fab; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="top-bar">
    <span>🌸 Flowers & Waffles</span>
    <div>
        <button onclick="window.location.href='index.html'">🛍️ Shop</button>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<h1 class="page-title">My Orders 📦</h1>
<p id="welcomeMsg" style="color:#888; margin-bottom:20px;"></p>

<div id="ordersContainer"></div>

<script>
    // Auth check
    const customer = JSON.parse(localStorage.getItem("customer"));
    if (!customer) {
        alert("Please login first");
        window.location.href = "customer-login.html";
    } else {
        document.getElementById("welcomeMsg").textContent = "Showing orders for " + customer.name + " 🌸";

        fetch("http://localhost:7000/my-orders/" + customer._id)
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("ordersContainer");

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="empty-msg">
                    <h3>No orders yet 😢</h3>
                    <p><a href="index.html">Start Shopping 🛍️</a></p>
                </div>`;
                return;
            }

            data.forEach(order => {
                let productsHTML = "";
                (order.products || []).forEach(p => {
                    productsHTML += `<li>${p.name} — ₹${p.price}</li>`;
                });

                const statusClass = "status-" + (order.status || "Pending");
                const date = new Date(order.orderDate).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });

                const div = document.createElement("div");
                div.classList.add("order-card");
                div.innerHTML = `
                    <h3>📅 Ordered on ${date}</h3>
                    <ul>${productsHTML}</ul>
                    <div class="order-meta">
                        <span class="order-total">Total: ₹${order.totalAmount}</span>
                        <span class="status ${statusClass}">${order.status || "Pending"}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        })
        .catch(err => {
            console.error(err);
            document.getElementById("ordersContainer").innerHTML = "<p style='color:red'>Error loading orders ❌ — make sure the server is running.</p>";
        });
    }

    function logout() {
        localStorage.removeItem("customer");
        window.location.href = "landing.html";
    }
</script>
</body>
</html>
